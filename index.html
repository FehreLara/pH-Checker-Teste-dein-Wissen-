<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pH-Challenge 🧪</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eaf6ff, #f7fbff);
    color: #17324d;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.app {
    width: 100%;
    max-width: 720px;
    background: white;
    border-radius: 28px;
    padding: 32px;
    box-shadow: 0 15px 45px rgba(30, 80, 120, 0.15);
    position: relative;
    overflow: hidden;
}

/* kleine Deko */
.bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.5;
}

.b1 {
    width: 70px;
    height: 70px;
    background: #d9efff;
    top: -20px;
    right: 80px;
}

.b2 {
    width: 35px;
    height: 35px;
    background: #bde4ff;
    top: 70px;
    right: 25px;
}

.test-tube {
    position: absolute;
    width: 26px;
    height: 85px;
    border: 3px solid #8ac7ed;
    border-top: 0;
    border-radius: 0 0 15px 15px;
    right: 25px;
    bottom: 25px;
    transform: rotate(12deg);
    opacity: 0.55;
}

.test-tube::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 35px;
    bottom: 2px;
    left: 0;
    background: #bce8ff;
    border-radius: 0 0 11px 11px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 2.2rem;
    color: #164c78;
}

.subtitle {
    margin-top: 8px;
    color: #6b8499;
}

.score {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #edf7ff;
    color: #17649a;
    font-weight: bold;
}

.question-number {
    text-align: center;
    color: #7890a3;
    font-size: 0.95rem;
    margin-bottom: 12px;
}

.question {
    text-align: center;
    font-size: 1.35rem;
    font-weight: bold;
    margin-bottom: 25px;
}

.pH-display {
    text-align: center;
    font-size: 4rem;
    font-weight: bold;
    margin: 10px 0 30px;
    color: #164c78;
}

.pH-label {
    font-size: 1rem;
    color: #7890a3;
    margin-top: -20px;
    margin-bottom: 20px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

button {
    border: none;
    border-radius: 16px;
    padding: 16px 10px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(0,0,0,0.12);
}

.acid {
    background: #ffe4e4;
    color: #b52f2f;
}

.neutral {
    background: #e5f6e8;
    color: #278044;
}

.basic {
    background: #e4efff;
    color: #2865a6;
}

.feedback {
    margin-top: 22px;
    padding: 20px;
    border-radius: 18px;
    display: none;
    text-align: center;
}

.feedback.correct {
    background: #e7f8ec;
    color: #246c3a;
}

.feedback.wrong {
    background: #fff0f0;
    color: #9b3030;
}

.feedback-title {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 8px;
}

.explanation {
    line-height: 1.5;
}

.next {
    margin-top: 18px;
    width: 100%;
    background: #17649a;
    color: white;
}

.compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 25px;
}

.pH-card {
    border: 2px solid #e5edf4;
    border-radius: 20px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    background: #fbfdff;
}

.pH-card:hover {
    border-color: #7bbce8;
    transform: translateY(-3px);
}

.pH-card.selected {
    border-color: #17649a;
    background: #edf7ff;
}

.pH-card .value {
    font-size: 2.8rem;
    font-weight: bold;
    color: #164c78;
}

.pH-card .small {
    color: #7890a3;
    margin-top: 5px;
}

.instruction {
    text-align: center;
    color: #5d7487;
    margin-bottom: 18px;
}

@media (max-width: 600px) {
    .app {
        padding: 22px;
    }

    h1 {
        font-size: 1.8rem;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

    .pH-display {
        font-size: 3.2rem;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="test-tube"></div>

    <header>
        <h1>🧪 pH-Challenge</h1>
        <div class="subtitle">
            Teste dein Wissen über saure, neutrale und basische Lösungen!
        </div>

        <div class="score">
            ⭐ Punkte: <span id="score">0</span>
        </div>
    </header>

    <div id="game"></div>

</div>

<script>

let score = 0;
let questionNumber = 0;
let currentQuestion = null;
let answered = false;

function randomPH() {
    return Math.round((1 + Math.random() * 13) * 10) / 10;
}

function formatPH(value) {
    return value.toFixed(1).replace(".", ",");
}

function classification(ph) {
    if (ph < 7) return "sauer";
    if (ph === 7) return "neutral";
    return "basisch";
}

function startGame() {
    nextQuestion();
}

function nextQuestion() {

    questionNumber++;
    answered = false;

    // Abwechselnd:
    // ungerade = sauer/neutral/basisch
    // gerade = Vergleich
    if (questionNumber % 2 === 1) {
        createClassificationQuestion();
    } else {
        createComparisonQuestion();
    }
}

function createClassificationQuestion() {

    const ph = randomPH();

    currentQuestion = {
        type: "classification",
        ph: ph,
        correct: classification(ph)
    };

    document.getElementById("game").innerHTML = `

        <div class="question-number">
            Aufgabe ${questionNumber}
        </div>

        <div class="question">
            Welcher Bereich passt zu diesem pH-Wert?
        </div>

        <div class="pH-display">
            pH ${formatPH(ph)}
        </div>

        <div class="pH-label">
            Klicke auf die richtige Antwort:
        </div>

        <div class="buttons">
            <button class="acid" onclick="answerClassification('sauer')">
                🔴 Sauer
            </button>

            <button class="neutral" onclick="answerClassification('neutral')">
                🟢 Neutral
            </button>

            <button class="basic" onclick="answerClassification('basisch')">
                🔵 Basisch
            </button>
        </div>

        <div id="feedback" class="feedback"></div>
    `;
}

function answerClassification(answer) {

    if (answered) return;

    answered = true;

    const correct = currentQuestion.correct;
    const ph = currentQuestion.ph;

    let explanation = "";

    if (ph < 7) {
        explanation = `Der pH-Wert ${formatPH(ph)} liegt unter 7. Lösungen mit einem pH-Wert unter 7 sind sauer.`;
    } else if (ph === 7) {
        explanation = `Der pH-Wert beträgt 7,0. Ein pH-Wert von 7 gilt als neutral.`;
    } else {
        explanation = `Der pH-Wert ${formatPH(ph)} liegt über 7. Lösungen mit einem pH-Wert über 7 sind basisch.`;
    }

    showFeedback(answer === correct, correct, explanation);
}

function createComparisonQuestion() {

    let ph1 = randomPH();
    let ph2 = randomPH();

    // Möglichst nicht gleiche Werte
    while (ph1 === ph2) {
        ph2 = randomPH();
    }

    const sameType = classification(ph1) === classification(ph2);

    let questionText;
    let correct;

    if (sameType && classification(ph1) === "sauer") {

        questionText = "Welche Lösung ist saurer?";
        correct = ph1 < ph2 ? 1 : 2;

    } else if (sameType && classification(ph1) === "basisch") {

        questionText = "Welche Lösung ist basischer?";
        correct = ph1 > ph2 ? 1 : 2;

    } else {

        // Falls unterschiedliche Bereiche entstehen,
        // wird eine allgemeine Frage gestellt.
        if (Math.random() < 0.5) {
            questionText = "Welche Lösung ist saurer?";
            correct = ph1 < ph2 ? 1 : 2;
        } else {
            questionText = "Welche Lösung ist basischer?";
            correct = ph1 > ph2 ? 1 : 2;
        }
    }

    currentQuestion = {
        type: "comparison",
        ph1: ph1,
        ph2: ph2,
        correct: correct,
        question: questionText
    };

    document.getElementById("game").innerHTML = `

        <div class="question-number">
            Aufgabe ${questionNumber}
        </div>

        <div class="question">
            ${questionText}
        </div>

        <div class="instruction">
            Klicke auf die Lösung, die du für richtig hältst.
        </div>

        <div class="compare">

            <div class="pH-card" id="card1" onclick="answerComparison(1)">
                <div class="value">
                    pH ${formatPH(ph1)}
                </div>
                <div class="small">
                    Lösung A
                </div>
            </div>

            <div class="pH-card" id="card2" onclick="answerComparison(2)">
                <div class="value">
                    pH ${formatPH(ph2)}
                </div>
                <div class="small">
                    Lösung B
                </div>
            </div>

        </div>

        <div id="feedback" class="feedback"></div>
    `;
}

function answerComparison(answer) {

    if (answered) return;

    answered = true;

    const correct = currentQuestion.correct;

    let explanation;

    if (currentQuestion.question.includes("saurer")) {

        const lower = Math.min(currentQuestion.ph1, currentQuestion.ph2);

        explanation =
            `Je kleiner der pH-Wert ist, desto saurer ist eine Lösung. ` +
            `Hier ist pH ${formatPH(lower)} der kleinere Wert.`;

    } else {

        const higher = Math.max(currentQuestion.ph1, currentQuestion.ph2);

        explanation =
            `Je größer der pH-Wert ist, desto basischer ist eine Lösung. ` +
            `Hier ist pH ${formatPH(higher)} der größere Wert.`;
    }

    showFeedback(answer === correct, correct === 1 ? 
        `pH ${formatPH(currentQuestion.ph1)}` :
        `pH ${formatPH(currentQuestion.ph2)}`, explanation);
}

function showFeedback(isCorrect, correctAnswer, explanation) {

    const feedback = document.getElementById("feedback");

    if (isCorrect) {
        score++;
        document.getElementById("score").textContent = score;

        feedback.className = "feedback correct";

        feedback.innerHTML = `
            <div class="feedback-title">
                🎉 Richtig!
            </div>

            <div class="explanation">
                ${explanation}
            </div>

            <button class="next" onclick="nextQuestion()">
                ➡️ Nächste Aufgabe
            </button>
        `;

    } else {

        feedback.className = "feedback wrong";

        feedback.innerHTML = `
            <div class="feedback-title">
                ❌ Leider falsch!
            </div>

            <div class="explanation">
                <strong>Richtige Antwort:</strong> ${correctAnswer}
                <br><br>
                ${explanation}
            </div>

            <button class="next" onclick="nextQuestion()">
                ➡️ Nächste Aufgabe
            </button>
        `;
    }

    feedback.style.display = "block";

    // Karten deaktivieren
    const cards = document.querySelectorAll(".pH-card");
    cards.forEach(card => {
        card.style.pointerEvents = "none";
    });
}

startGame();

</script>

</body>
</html>
